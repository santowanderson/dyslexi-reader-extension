<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
  <title>Dyslexia Reader Helper</title>
</head>
<body style="width: 250px; padding: 15px;">
  <h2>Dyslexia Reader Helper</h2>
  <div class="control-group">
    <label for="font-family">
      <input type="checkbox" id="font-family" checked> Use OpenDyslexic
    </label>
  </div>
  <div class="control-group">
    <label for="font-size">Font Size:</label>
    <input type="range" id="font-size" min="12" max="48" value="18">
    <span id="font-size-value">18</span>
  </div>
  <div class="control-group">
    <label for="line-height">Line Height:</label>
    <input type="range" id="line-height" min="1" max="3" step="0.1" value="1.5">
    <span id="line-height-value">1.5</span>
  </div>
  <div class="control-group">
    <label for="letter-spacing">Letter Spacing:</label>
    <input type="range" id="letter-spacing" min="-2" max="10" step="0.5" value="0">
    <span id="letter-spacing-value">0</span>
  </div>
  <script src="popup.js"></script>
</body>
</html>
